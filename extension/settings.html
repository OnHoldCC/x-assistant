<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnHold 助手</title><link rel="icon" href="assets/assistant-32.png"><link rel="stylesheet" href="select-ui.css"><link rel="stylesheet" href="settings.css"></head><body><main>
<div class="brand-bar"><div class="brand-identity"><img src="assets/assistant-48.png" width="32" height="32" alt=""><span>OnHold 助手</span></div><span class="free-badge">永久免费</span><nav class="social-links" aria-label="作者主页"><a href="https://x.com/OnHoldCC" target="_blank" rel="noopener noreferrer" aria-label="X：@OnHoldCC" title="X：@OnHoldCC"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-7.4L5.5 22H2.3l7.2-8.3L.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L6.4 3.9H4.6L17.8 20Z"/></svg></a><a href="https://t.me/On_Hold_CC" target="_blank" rel="noopener noreferrer" aria-label="Telegram：@On_Hold_CC" title="Telegram：@On_Hold_CC"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.4 3.2c.7-.3 1.3.2 1.1 1.1l-3.2 15.1c-.2 1.1-.9 1.4-1.9.8l-4.9-3.6-2.4 2.3c-.3.3-.6.6-1.1.6l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.3L6.7 13.2l-4.8-1.5c-1-.3-1.1-1 .2-1.5l19.3-7Z"/></svg></a></nav></div>
<nav class="tabs" aria-label="插件页面"><button type="button" data-pane="overview" class="selected" aria-pressed="true">翻译状态</button><button type="button" data-pane="translation" aria-pressed="false">设置</button></nav>
<div class="site-control"><button id="add-current-site" type="button" disabled>将当前网站加入自动翻译</button><p id="current-site-status" class="hint" role="status" aria-live="polite"></p></div>
<form id="settings"><section class="pane" id="pane-overview"><header><div class="account-heading"><h1>本机翻译</h1><span id="model-state" class="model-state">连接中…</span></div><p id="model-name">Hy-MT2 · 正文与发帖翻译</p><div class="account-heading decision-heading"><h2>本机评分</h2><span id="decision-state" class="model-state">连接中…</span></div><p id="decision-name">Laya 多语版</p></header>
<div class="stats stats-primary"><div><span>成功翻译</span><strong id="translation-count">0</strong><small>段</small></div><div><span>平均耗时</span><strong id="translation-average">—</strong><small>ms / 推理段落</small></div></div>
<p class="hint" id="translation-count-note">模型推理 0 · 缓存命中 0</p>
<div class="resource-stats"><div><span>CPU · 本程序</span><strong id="translation-cpu">—</strong></div><div><span>本程序内存</span><strong id="translation-memory">—</strong></div><div title="浏览器设置和本机 SQLite 数据，不含模型与运行环境"><span>数据占用</span><strong id="translation-data">—</strong></div></div>
<p id="model-error" class="hint" role="status"></p>
<button id="refresh-status" class="quiet" type="button">刷新状态 ↻</button><button id="reload-extension" class="quiet" type="button">更新后重载插件</button>
</section><section class="pane" id="pane-translation" hidden><header><h1>翻译设置</h1></header>
<label class="toggle"><input id="autoTranslate" type="checkbox"><span><strong>自动翻译正文</strong><small>逐段显示，保留原文。</small></span></label>
<div class="setting-line"><label for="readingTarget">阅读译为</label><select id="readingTarget"><option value="zh">简体中文</option></select></div>
<label class="toggle"><input id="allWebsites" type="checkbox"><span><strong>翻译其他白名单网页</strong></span></label>
<label class="toggle"><input id="postAnalysis" type="checkbox"><span><strong>X 推文标签与评分</strong><small>选中推文后，由本地决策模型筛选标签。</small></span></label>
<label for="translationAllowlist">URL 白名单</label><textarea id="translationAllowlist" rows="4" spellcheck="false"></textarea><p class="hint">每行一条，支持路径 *。留空暂停阅读翻译。</p>
<label class="toggle"><input id="composeTranslate" type="checkbox"><span><strong>X 多语言草稿翻译</strong><small>自动准备译文，点击按钮在独立弹窗核对并应用。</small></span></label>
<div class="setting-line"><label for="composeTarget">发帖目标语言</label><select id="composeTarget"><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select></div>
<button id="save" type="submit" class="primary">保存设置</button><p id="status" role="status"></p>
</section></form>
<script type="module" src="settings.js"></script><script src="settings-ui.js"></script><script src="extension-actions.js"></script><script src="select-ui.js"></script></main></body></html>
