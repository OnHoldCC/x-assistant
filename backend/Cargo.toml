[package]
name = "onhold-backend"
version = "0.8.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.28", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3.27"
