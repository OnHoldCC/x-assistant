[package]
name = "onhold-backend"
version = "0.8.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "io-util"] }
rusqlite = { version = "0.32.1", features = ["bundled", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.28", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }

[dev-dependencies]
tempfile = "3.27"
