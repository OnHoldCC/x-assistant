[package]
name = "onhold-admin-app"
version = "0.9.2"
edition = "2021"

[lib]
name = "onhold_admin_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde_json = "1.0"
serde = {version="1.0",features= ["derive"] }
onhold-backend = { path = "../../backend" }
tokio = { version = "1.53", features = ["net", "process", "io-util", "time", "sync"] }
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "=2.5.5"

# Keep proc-macro metadata; stripping breaks macro loading on this macOS toolchain.
[profile.release]
strip = "none"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
