name: Verify React TypeScript Rust admin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm --prefix app ci --no-audit --no-fund
      - run: npm run app:build
      - run: npm test
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml --locked
